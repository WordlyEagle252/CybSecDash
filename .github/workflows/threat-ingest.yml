name: Threat Intel Ingestion Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch CISA KEV Data
        run: |
          mkdir -p data
          curl -sL "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json" -o data/cisa_kev.json

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cisa_kev.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Automated ingestion: Updated threat intel feeds"
          git push